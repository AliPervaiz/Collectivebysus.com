<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Your Gallery | Collective by Sus</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/gallery.css" />
</head>
<body class="proof-page">

  <nav class="site-nav">
    <div class="nav-inner">
      <a href="/" class="brand">Collective by Sus<span>.</span></a>
      <span class="proof-nav-label">Private Gallery</span>
    </div>
  </nav>

  <main id="app">
    <div class="proof-status"><p>Loading your gallery…</p></div>
  </main>

  <!-- Sticky selection bar -->
  <div class="proof-bar" id="bar" hidden>
    <div class="proof-bar-inner">
      <div class="proof-bar-count">
        <span id="barCount">0</span>
        <span id="barLabel">selected</span>
      </div>
      <div class="proof-bar-msg" id="barMsg"></div>
      <button class="btn solid" id="submitBtn" type="button">Send my selections</button>
    </div>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Photo viewer">
    <button class="lb-close" type="button" aria-label="Close">&times;</button>
    <button class="lb-nav lb-prev" type="button" aria-label="Previous photo">&#8249;</button>
    <figure class="lb-figure">
      <img id="lbImg" alt="" />
    </figure>
    <button class="lb-nav lb-next" type="button" aria-label="Next photo">&#8250;</button>
    <div class="lb-footer">
      <span class="lb-counter" id="lbCounter"></span>
      <div class="lb-actions">
        <a class="lb-download" id="lbDownload" hidden>Download</a>
        <button class="heart-btn lb-heart" id="lbHeart" type="button" aria-label="Favorite">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.6-9.3C.9 7.7 3.2 4 6.9 4c2.1 0 3.6 1.1 5.1 3 1.5-1.9 3-3 5.1-3 3.7 0 6 3.7 4.5 7.2-2.1 4.7-9.6 9.3-9.6 9.3z"/></svg>
          <span>Favorite</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Submit dialog -->
  <div class="modal" id="submitModal" hidden role="dialog" aria-modal="true" aria-labelledby="submitTitle">
    <div class="modal-card">
      <h3 id="submitTitle">Send your selections</h3>
      <p id="submitSummary"></p>
      <label class="field">
        <span>Anything you'd like me to know? (optional)</span>
        <textarea id="submitNote" rows="4" maxlength="4000" placeholder="Edits, crops, a favorite of favorites…"></textarea>
      </label>
      <div class="modal-actions">
        <button class="btn" type="button" id="submitCancel">Keep looking</button>
        <button class="btn solid" type="button" id="submitConfirm">Send to Susi</button>
      </div>
    </div>
  </div>

  <footer class="proof-footer">
    <span>© 2026 Collective by Sus</span>
    <a href="mailto:contact@collectivebysus.com">contact@collectivebysus.com</a>
  </footer>

  <script src="/js/gallery.js"></script>
</body>
</html>
